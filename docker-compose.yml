services:
  minio:
    image: coollabsio/minio:latest
    container_name: it_job_finder_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio-data:/data

  db:
    image: postgres:latest
    container_name: it_job_finder_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  minio-data:
  postgres-data: